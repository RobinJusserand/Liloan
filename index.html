<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>31 jours avant le 31 décembre</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfaf5;
      --green: #1e352f;
      --red: #8c2f39;
      --gold: #d4af37;
      --text-dark: #1c1c1c;
      --text-light: #fdfaf5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
    }

    header {
      text-align: center;
      max-width: 560px;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      color: var(--green);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.5;
    }

    .countdown-box {
      background: var(--green);
      color: var(--text-light);
      padding: 16px 24px;
      border-radius: 14px;
      margin-bottom: 28px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(30, 53, 47, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.45);
      width: 100%;
      max-width: 580px;
    }

    .countdown-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .countdown-timer {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 660px;
    }

    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(6, 1fr); }
    }

    .tile {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      user-select: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .tile.locked {
      background: var(--green);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
    }

    .tile.unlocked {
      background: var(--red);
      color: var(--text-light);
      border: 2px solid var(--gold);
      cursor: pointer;
      animation: pulse 2s infinite;
    }

    .tile.unlocked:hover {
      transform: scale(1.05);
    }

    .tile.opened {
      cursor: pointer;
      border: 2px solid var(--gold);
      background-size: cover;
      background-position: center;
      color: #fff;
    }

    .tile.opened::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
    }

    .tile.opened:hover {
      transform: scale(1.05);
    }

    .tile-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      font-weight: 700;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .tile-sub {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
      position: relative;
      z-index: 1;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.55); }
      70% { box-shadow: 0 0 0 9px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--bg);
      max-width: 460px;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 48px rgba(0,0,0,0.3);
      border: 2px solid var(--gold);
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .modal-photo {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
      background: #e9e4db;
    }

    .modal-body {
      padding: 22px 24px 26px;
      text-align: center;
    }

    .modal-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      color: var(--red);
      margin-bottom: 10px;
    }

    .modal-text {
      font-size: 1rem;
      line-height: 1.65;
      color: #2b2b2b;
    }
  </style>
</head>
<body>

  <header>
    <h1>31 jours avant le 31 décembre</h1>
    <p class="subtitle">Un nouveau souvenir se débloque chaque jour à minuit (heure du Vietnam) jusqu'à nos retrouvailles.</p>
  </header>

  <div class="countdown-box">
    <div class="countdown-label" id="countdown-label">Chargement de l'heure du Vietnam...</div>
    <div class="countdown-timer" id="countdown-timer">--j --h --m --s</div>
  </div>

  <div class="grid" id="calendar-grid"></div>

  <div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target === this) closeModal()">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <img class="modal-photo" id="modal-photo" src="" alt="Souvenir de nous" />
      <div class="modal-body">
        <h2 class="modal-date" id="modal-date">1er décembre</h2>
        <p class="modal-text" id="modal-text"></p>
      </div>
    </div>
  </div>

  <script src="days.js"></script>

  <script>
    const TARGET_YEAR = 2026;
    const VN_OFFSET_MS = 7 * 60 * 60 * 1000;
    const isPreview = new URLSearchParams(window.location.search).get('preview') === 'true';

    let openedDays = JSON.parse(localStorage.getItem('opened_days_2026') || '[]');

    function getVietnamNow() {
      const now = new Date();
      const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utcMs + VN_OFFSET_MS);
    }

    function getMaxUnlockedDay() {
      if (isPreview) return 31;
      const vnNow = getVietnamNow();
      const year = vnNow.getFullYear();
      const month = vnNow.getMonth();

      if (year < TARGET_YEAR || (year === TARGET_YEAR && month < 11)) return 0;
      if (year > TARGET_YEAR) return 31;
      return Math.min(31, vnNow.getDate());
    }

    function updateCountdown() {
      const vnNow = getVietnamNow();
      const dec1 = new Date(TARGET_YEAR, 11, 1, 0, 0, 0);
      const dec31 = new Date(TARGET_YEAR, 11, 31, 0, 0, 0);

      let targetDate;
      let label;

      if (vnNow < dec1) {
        targetDate = dec1;
        label = "Compte à rebours avant le 1er déc. (minuit, heure du Vietnam)";
      } else if (vnNow < dec31) {
        targetDate = new Date(vnNow.getFullYear(), vnNow.getMonth(), vnNow.getDate() + 1, 0, 0, 0);
        const daysLeft = Math.ceil((dec31 - vnNow) / (1000 * 60 * 60 * 24));
        const jourWord = daysLeft > 1 ? 'jours' : 'jour';
        label = `Prochaine photo dans (${daysLeft} ${jourWord} avant le 31 déc.)`;
      } else {
        document.getElementById('countdown-label').textContent = "NOUS SOMMES LE 31 DÉCEMBRE !";
        document.getElementById('countdown-timer').textContent = "À tout de suite ❤️";
        return;
      }

      const diff = targetDate - vnNow;
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / 1000 / 60) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById('countdown-label').textContent = label;
      document.getElementById('countdown-timer').textContent =
        `${d > 0 ? d + 'j ' : ''}${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
    }

    function renderGrid() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      const maxDay = getMaxUnlockedDay();
      const data = typeof ADVENT_DAYS !== 'undefined' ? ADVENT_DAYS : [];

      data.forEach(item => {
        const tile = document.createElement('div');
        tile.className = 'tile';

        const isUnlocked = item.day <= maxDay;
        const isOpened = openedDays.includes(item.day);

        if (isUnlocked && isOpened) {
          tile.classList.add('opened');
          tile.style.backgroundImage = `url('${item.image}')`;
          tile.innerHTML = `<span class="tile-num">${item.day}</span>`;
          tile.onclick = () => openDay(item);
        } else if (isUnlocked) {
          tile.classList.add('unlocked');
          tile.innerHTML = `<span class="tile-num">${item.day}</span><span class="tile-sub">Ouvrir</span>`;
          tile.onclick = () => openDay(item);
        } else {
          tile.classList.add('locked');
          tile.innerHTML = `<span class="tile-num">${item.day}</span><span class="tile-sub">🔒</span>`;
        }

        grid.appendChild(tile);
      });
    }

    function openDay(item) {
      if (!openedDays.includes(item.day)) {
        openedDays.push(item.day);
        localStorage.setItem('opened_days_2026', JSON.stringify(openedDays));
        renderGrid();
      }

      document.getElementById('modal-photo').src = item.image;
      document.getElementById('modal-date').textContent = item.day === 1 ? "1er décembre" : `${item.day} décembre`;
      document.getElementById('modal-text').textContent = item.text;
      document.getElementById('modal-backdrop').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('active');
    }

    updateCountdown();
    renderGrid();
    setInterval(() => {
      updateCountdown();
      renderGrid();
    }, 1000);
  </script>
</body>
</html>
